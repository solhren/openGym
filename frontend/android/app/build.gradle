apply plugin: 'com.android.application'

// Personal CI builds must use the retained key, independent of SDK/runner defaults.
def personalDebugKeystore = System.getenv('OPENGYM_ANDROID_DEBUG_KEYSTORE')
def publicAndroid = System.getenv('OPENGYM_PUBLIC_ANDROID') == '1'
def publicKeystore = System.getenv('OPENGYM_PUBLIC_ANDROID_KEYSTORE')
def publicVersion = System.getenv('OPENGYM_PUBLIC_ANDROID_VERSION_CODE')
if (publicAndroid && (personalDebugKeystore || !publicKeystore ||
        !new File(publicKeystore).isAbsolute() || !new File(publicKeystore).isFile() ||
        !(publicVersion ==~ /[1-9][0-9]{0,8}/))) {
    throw new GradleException('Public Android requires its separate retained debug key and positive version code; personal signing is forbidden')
}
if (publicAndroid) {
    def publicAssets = file('src/main/assets/public/index.html')
    if (!publicAssets.isFile() || !publicAssets.text.contains('name="opengym-distribution" content="selfhosted"')) {
        throw new GradleException('Build and sync the self-hosted mobile assets before packaging this distribution')
    }
}
if (personalDebugKeystore && (!new File(personalDebugKeystore).isAbsolute() || !new File(personalDebugKeystore).isFile())) {
    throw new GradleException('Configured personal debug keystore is missing or not absolute')
}

android {
    namespace "ch.duartesantos.opengym"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId publicAndroid ? "fr.solhren.opengym.selfhosted" : "ch.duartesantos.opengym"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode publicAndroid ? publicVersion.toInteger() : 26
        versionName "1.4.1"
        manifestPlaceholders = [
            opengymAllowBackup: publicAndroid ? 'false' : 'true',
            opengymBackupRules: publicAndroid ? '@xml/backup_rules_public' : '@xml/backup_rules',
            opengymDataExtractionRules: publicAndroid ? '@xml/data_extraction_rules_public' : '@xml/data_extraction_rules',
            opengymNetworkSecurityConfig: publicAndroid ? '@xml/network_security_config_public' : '@xml/network_security_config',
            opengymApplicationLabel: publicAndroid ? '@string/selfhosted_app_name' : '@string/app_name',
            opengymActivityLabel: publicAndroid ? '@string/selfhosted_app_name' : '@string/title_activity_main'
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            if (publicAndroid) {
                storeFile file(publicKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            } else if (personalDebugKeystore) {
                storeFile file(personalDebugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // The barcode scanner's ML Kit library ships a native build for four CPU families.
            // Phones are ARM; the two x86 builds only serve emulators and a few Chromebooks, which
            // run ARM code through translation anyway. Leaving them out takes about 12 MB off
            // the APK. Release only: the debug build keeps x86_64 for the emulator test rig.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        debug {
            // Test build installs side-by-side with the real app: its own applicationId, so both
            // can live on one device. The name/icon label is overridden by the debug resource
            // overlay in src/debug/res. The release build (the "real" app) is untouched.
            applicationIdSuffix publicAndroid ? ".debug" : ".test"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Writing workouts and weigh-ins to Health Connect (#200, HealthConnectPlugin). Off until the
    // user turns it on. 1.1.0-alpha12 is the last release that builds with compileSdk 35 and AGP
    // 8.7; 1.1.0 stable asks for compileSdk 36 and AGP 8.9.1.
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
