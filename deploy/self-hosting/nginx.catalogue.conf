pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
 include /etc/nginx/mime.types;
 access_log off;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 resolver 127.0.0.11 valid=10s ipv6=off;
 server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  # Catalogue routes use the same authenticated API; no provider proxy here.
  location ^~ /api/ {
   set $backend http://api:3000;
   proxy_pass $backend;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header CF-Connecting-IP "";
   client_max_body_size 5m;
   proxy_read_timeout 300s;
  }
  location ^~ /api/media/ {
   set $backend http://api:3000;
   proxy_pass $backend;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header CF-Connecting-IP "";
   client_max_body_size 48m;
   proxy_request_buffering off;
   proxy_read_timeout 300s;
   proxy_send_timeout 300s;
  }
  location = /index.html { add_header Cache-Control no-cache always; }
  location = /sw.js { add_header Cache-Control no-cache always; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
