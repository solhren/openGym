name: Bug report
description: Something in openGym is broken or not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is a **public** issue for solhren/openGym. For vulnerabilities, read [SECURITY.md](https://github.com/solhren/openGym/security/policy) instead.
        Do not attach .env files, backups, private logs, tokens, pairing codes or personal histories. Use synthetic examples and redact screenshots.
  - type: input
    id: revision
    attributes:
      label: Commit or build identifier
      description: An upstream package version alone does not identify this fork's build.
    validations:
      required: true
  - type: dropdown
    id: account-mode
    attributes:
      label: Account mode
      options:
        - Personal
        - Multi-user with invitations
        - Multi-user with public signup
        - Legacy or unknown
    validations:
      required: true
  - type: input
    id: food-source
    attributes:
      label: Nutrition source (if relevant)
      placeholder: Personal foods only, Ciqual 2025, or a separately provisioned catalogue
  - type: textarea
    id: what-happened
    attributes:
      label: What did you do?
      description: Steps to reproduce, as precisely as you can.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include only redacted errors or synthetic screenshots; preserve the original local data.
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: How are you running openGym?
      options:
        - Self-hosted (docker compose)
        - Frontend dev server (npm run dev)
        - Android source build
        - Other / not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser & OS
      placeholder: e.g. Safari 17 on iOS 18, Chrome 126 on Android
    validations:
      required: true

  - type: checkboxes
    id: passkey
    attributes:
      label: Is this about login / passkeys?
      description: >
        Most login issues are an `RP_ID`/`ORIGIN` mismatch — check your `.env` against the
        domain you're accessing openGym from before reporting. See the
        [self-hosting guide](https://github.com/solhren/openGym/blob/HEAD/docs/SELF_HOSTING.md).
      options:
        - label: Yes, this is a login/passkey issue and I've already checked RP_ID/ORIGIN
