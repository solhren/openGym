name: Publication policy

on:
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/publication/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main, review/public-readiness]
    paths:
      - '.github/**'
      - 'scripts/publication/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/publication/check.test.mjs
      - run: node scripts/publication/check.mjs
