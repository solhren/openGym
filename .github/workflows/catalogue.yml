# Checks every change to the exercise catalogue: the entries themselves (scripts/catalogue/validate.mjs)
# and that the files the app is built from were regenerated (build.mjs --check).
name: Catalogue

on:
  pull_request:
    paths: ['catalogue/**', 'scripts/catalogue/**', 'frontend/src/lib/exercises-data.js', 'frontend/src/instr/**', 'frontend/src/exercise-names/**', 'frontend/src/exercise-desc/**', '.github/workflows/catalogue.yml']
  push:
    branches: [main]
    paths: ['catalogue/**', 'scripts/catalogue/**', '.github/workflows/catalogue.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate the catalogue
        run: node scripts/catalogue/validate.mjs
      - name: Generated files are up to date
        run: node scripts/catalogue/build.mjs --check
      - name: Media stay within 180 px (licence)
        run: node scripts/catalogue/check-media.mjs
